name: Refresh live robot profile dashboard

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dashboard-refresh.yml"
      - "scripts/update_dashboard.py"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: live-profile-dashboard
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Validate dashboard generator syntax
        run: python -m py_compile scripts/update_dashboard.py

      - name: Generate live GitHub data and dashboard graphics
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python scripts/update_dashboard.py

      - name: Validate generated data and SVG assets
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          data = json.loads(Path("generated/profile-data.json").read_text(encoding="utf-8"))
          assert data.get("username"), "Missing GitHub username"
          assert data.get("generated_at"), "Missing generation timestamp"
          assert isinstance(data.get("is_live"), bool), "Missing live/fallback status"
          assert isinstance(data.get("public_repositories"), int), "Invalid public repository count"
          assert isinstance(data.get("tracked_repositories"), int), "Invalid tracked repository count"
          assert isinstance(data.get("recent_repositories"), list), "Recent repository list missing"
          assert isinstance(data.get("top_languages"), list), "Language summary missing"
          for item in data["recent_repositories"]:
              assert item.get("url", "").startswith("https://github.com/"), "Unsafe or missing repository URL"
          for asset in ("generated/robot-dashboard.svg", "generated/recent-projects.svg"):
              root = ET.parse(asset).getroot()
              assert root.tag.endswith("svg"), f"Invalid SVG root: {asset}"
              assert root.attrib.get("viewBox"), f"Missing responsive viewBox: {asset}"
          dashboard = Path("generated/robot-dashboard.svg").read_text(encoding="utf-8")
          assert "OPEN LIVE PORTFOLIO" in dashboard, "Portfolio link missing from dashboard"
          assert "LATEST PUBLIC ACTIVITY" in dashboard, "Activity section missing from dashboard"
          print("Dashboard JSON, links, and SVG assets passed validation.")
          PY

      - name: Commit refreshed dashboard assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh live robot profile dashboard"
            git push
          else
            echo "Dashboard assets are already current."
          fi
